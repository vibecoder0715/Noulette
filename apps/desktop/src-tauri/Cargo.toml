[package]
name = "noulette-desktop"
version = "1.0.0"
description = "Noulette desktop app"
authors = ["Noulette"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
