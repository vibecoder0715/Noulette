  <circle cx="56" cy="130" r="12" fill="#0284C7"/>
  <text x="56" y="135" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">N</text>
  <text x="76" y="134" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">Main Process</text>
  <rect x="52" y="156" width="158" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
  <text x="62" y="172" font-family="monospace" font-size="10.5" fill="#38BDF8">port: 5173 / tauri</text>
  <rect x="52" y="190" width="158" height="24" rx="4" fill="#0F172A" stroke="#1E293B"/>
