  <text x="640" y="210" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">Cline / OpenCode</text>

  <rect x="568" y="228" width="144" height="28" rx="6" fill="#1E1B4B" stroke="#4338CA"/>
  <text x="640" y="246" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">Codex / Gemini</text>

  <rect x="568" y="268" width="144" height="44" rx="6" fill="#6B21A8" opacity="0.3"/>
  <text x="640" y="287" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle">Automatic Handshake</text>
  <text x="640" y="302" font-family="-apple-system, sans-serif" font-size="9.5" fill="#D8B4FE" text-anchor="middle">Real-time verification</text>
