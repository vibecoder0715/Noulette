  <text x="389" y="298" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">IPC stdin/stdout pipe</text>

  <!-- Flow 2: Connecting line to Coding Agents -->
  <line x1="484" y1="200" x2="542" y2="200" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6 3"/>
  <polygon points="542,196 552,200 542,204" fill="#10B981"/>

