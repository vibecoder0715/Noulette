  <circle cx="38" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="54" cy="21" r="5.5" fill="#10B981"/>
  <text x="380" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">Noulette MCP Engine (Background Daemon · Sidecar Active)</text>

  <!-- Node 1: Desktop Application Shell -->
  <rect x="36" y="70" width="190" height="260" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
